# Blueprint Render — déploiement Gabarys (SaaS multi-tenant).
# Un service web (backend + frontend servi par le backend) + une base PostgreSQL.
#
# Déploiement : sur https://dashboard.render.com → New → Blueprint → choisir ce repo.
# Render lit ce fichier et provisionne la base + le service.
#
# Après le 1er déploiement, renseigner dans le dashboard (Environment) :
#  - ANTHROPIC_API_KEY        → active la lecture photo
#  - SEED_SUPERADMIN_EMAIL    → email du compte backoffice super_admin
#  - SEED_SUPERADMIN_PASSWORD → mot de passe du super_admin (défaut : superadmin1234)
#  - SEED_ADMIN_EMAIL         → email admin du 1er tenant (défaut : admin@gabarys.local)
#  - SEED_ADMIN_PASSWORD      → mot de passe admin (défaut : admin1234)
#
# L'app sera servie sur https://<nom-du-service>.onrender.com

databases:
  - name: ulysse-db
    plan: free

services:
  - type: web
    name: gabarys
    runtime: docker
    plan: free
    branch: claude/new-session-hc0ixc
    rootDir: app
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ulysse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: VISION_MODEL
        value: claude-opus-4-8
      # À renseigner manuellement dans le dashboard (jamais committées).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SEED_SUPERADMIN_EMAIL
        sync: false
      - key: SEED_SUPERADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
