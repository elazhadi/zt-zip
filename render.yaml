services:
  - type: web
    name: ao-manager
    runtime: docker
    dockerContext: ao-manager
    dockerfilePath: ao-manager/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: UPLOAD_DIR
        value: /app/uploads
