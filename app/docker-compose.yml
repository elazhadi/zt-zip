# Stack complète ULYSSE 70 : PostgreSQL + backend (API) + frontend (nginx).
# Démarrage :  docker compose up --build
# Frontend :   http://localhost:8080
# API :        http://localhost:8080/api  (proxifiée par nginx vers le backend)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ulysse
      POSTGRES_PASSWORD: ulysse
      POSTGRES_DB: ulysse70
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulysse -d ulysse70"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 4000
      DATABASE_URL: postgres://ulysse:ulysse@db:5432/ulysse70
      JWT_SECRET: ${JWT_SECRET:-change-me-en-production}
      JWT_EXPIRES_IN: 12h
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      # Renseigner pour activer la lecture photo (sinon saisie manuelle).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-claude-opus-4-8}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@ulysse70.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin1234}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
