    document.addEventListener("change", (e) => { const t = e.target; if ((t.id === "pack-file" || t.id === "pack-file2") && t.files && t.files[0]) readPackFile(t.files[0]); });
    $("#statusLine").addEventListener("click", (e) => {
      const b = e.target.closest("[data-act]");
      if (!b) return;
      if (b.dataset.act === "toggle-counter") { S.counterView = !S.counterView; recompute(); route(); renderAll(); }
      if (b.dataset.act === "publish") publishGrid();
    });

    /* Tarif */
    const vt = $("#view-tarif");
    let qT = null;
    vt.addEventListener("input", (e) => {
      if (e.target.id === "tf-q") { S.tf.q = e.target.value; clearTimeout(qT); qT = setTimeout(() => { renderFilters(); renderTable(); }, 120); }
    });
    vt.addEventListener("change", (e) => {
      const t = e.target;
      if (t.id === "tf-fin") { S.tf.fin = t.value; persistTf(); renderTable(); return; }
      if (t.dataset.f) {
        const arr = S.tf[t.dataset.f];
        const i = arr.indexOf(t.value);
        if (t.checked && i < 0) arr.push(t.value);
        if (!t.checked && i >= 0) arr.splice(i, 1);
        persistTf(); renderFilters(); renderTable();
      }
    });
    vt.addEventListener("click", (e) => {
      const t = e.target;
      const tg = t.closest("#tf-unite button, #tf-tranche button");
      if (tg) { const k = tg.parentElement.id === "tf-unite" ? "unite" : "tranche"; S.tf[k] = tg.dataset.v; persistTf(); renderTarif(); return; }
      const sb = t.closest("button.sort");
      if (sb) { const k = sb.dataset.sort; S.tf.sort = S.tf.sort.k === k ? { k, d: -S.tf.sort.d } : { k, d: 1 }; persistTf(); renderTable(); return; }
      const a = t.closest("[data-act]");
      if (a) {
        const act = a.dataset.act;
        if (act === "quick-add") { e.stopPropagation(); addLine(a.dataset.key, S.tf.fin, 1); return; }
        if (act === "reset-filters") { Object.assign(S.tf, { q: "", fam: [], ser: [], typ: [], grp: [] }); persistTf(); renderTarif(); return; }
        if (act === "unfilter") { const arr = S.tf[a.dataset.f]; const i = arr.indexOf(a.dataset.v); if (i >= 0) arr.splice(i, 1); persistTf(); renderFilters(); renderTable(); return; }
        if (act === "export-tarif") { exportTarif(); return; }
      }
      if (t.closest("#tf-ftoggle")) { S.filtersOpen = !S.filtersOpen; $("#tf-filters").classList.toggle("open", S.filtersOpen); return; }
      const row = t.closest("tr.row");
      if (row) { S.drawer = row.dataset.key; renderDrawer(); }
    });
    vt.addEventListener("keydown", (e) => { if (e.key === "Enter") { const row = e.target.closest && e.target.closest("tr.row"); if (row) { S.drawer = row.dataset.key; renderDrawer(); } } });

    /* Fiche */
    $("#drawer-root").addEventListener("click", (e) => {
      const a = e.target.closest("[data-act]");
      if (!a) return;
      if (a.dataset.act === "close-drawer") { S.drawer = null; renderDrawer(); }
      if (a.dataset.act === "drawer-add") {
        const q = Math.max(1, Math.round(parseNum($("#dr-qte").value) || 1));
        addLine(a.dataset.key, $("#dr-fin").value, q);
        S.drawer = null; renderDrawer();
      }
    });

    /* Devis */
    const vd = $("#view-devis");
    vd.addEventListener("input", (e) => {
      const t = e.target;
      if (t.id === "q-search") { S.qsearch = t.value; S.qsel = 0; renderCombo(); return; }
      if (t.id === "q-savedsearch") { S.savedQ = t.value; S._savedFocus = true; renderSaved(); return; }
      if (t.dataset.q) { S.quote[t.dataset.q] = t.value; S.quoteDirty = true; persistDraft(); return; }
      if (t.dataset.li === "qte") {
        const i = +t.closest("tr").dataset.i;
        const n = parseNum(t.value);
        S.quote.lignes[i].qte = isFinite(n) && n >= 0 ? n : 0;
        S.quoteDirty = true; persistDraft(); refreshQuoteComputed();
      }
    });
    vd.addEventListener("change", (e) => {
      const t = e.target;
      if (t.id === "q-findef") { S.quote.finitionDefaut = t.value; S.quoteDirty = true; persistDraft(); renderQuoteLines(); return; }
      if (t.dataset.li === "finition") { const i = +t.closest("tr").dataset.i; S.quote.lignes[i].finition = t.value || null; S.quoteDirty = true; persistDraft(); renderQuoteLines(); }
    });
    vd.addEventListener("keydown", (e) => {
      const t = e.target;
      if (t.id === "q-search") {
        const res = quoteSearchResults(S.qsearch);
        if (e.key === "ArrowDown") { e.preventDefault(); S.qsel = Math.min(S.qsel + 1, res.length - 1); renderCombo(); }
        else if (e.key === "ArrowUp") { e.preventDefault(); S.qsel = Math.max(S.qsel - 1, 0); renderCombo(); }
        else if (e.key === "Enter") { e.preventDefault(); const p = res[S.qsel]; if (p) { const at = addLine(p.key, null, 1); S.qsearch = ""; t.value = ""; renderCombo(); renderQuoteLines(); focusQty(at); } }
        else if (e.key === "Escape") { S.qsearch = ""; t.value = ""; renderCombo(); }
      }
    });
    vd.addEventListener("click", async (e) => {
      const li = e.target.closest("#q-results li[data-key]");
      if (li) { const at = addLine(li.dataset.key, null, 1); S.qsearch = ""; $("#q-search").value = ""; renderCombo(); renderQuoteLines(); focusQty(at); return; }
      const a = e.target.closest("[data-act]");
      if (!a) return;
      const act = a.dataset.act, k = a.dataset.k;
      if (act === "del-line") { S.quote.lignes.splice(+a.dataset.i, 1); S.quoteDirty = true; persistDraft(); renderTop(); renderQuoteLines(); }
      else if (act === "save-quote") { a.disabled = true; try { await saveQuote(); } finally { renderTotals(calcQuote()); renderSaved(); } }
      else if (act === "new-quote") { if (S.quoteDirty && S.quote.lignes.length) { S.quoteConfirm = "new"; renderQuoteLines(); } else resetQuote(); }
      else if (act === "new-quote-yes") resetQuote();
      else if (act === "dup-quote") { const q = clone(S.quote); Object.assign(q, { id: null, src: null, numero: genNumero(), date: localToday(), creeLe: null, creePar: null, tarif: null, totaux: null, _v: Date.now() }); S.quote = q; S.quoteDirty = true; persistDraft(); toast("Copie créée : pensez à l'enregistrer"); renderAll(); }
      else if (act === "copy-quote") copyQuote();
      else if (act === "export-quote") exportQuote();
      else if (act === "open-quote") { if (S.quoteDirty && S.quote.lignes.length && !(S.quote.src + ":" + S.quote.id === k)) { S.quoteConfirm = "open:" + k; renderSaved(); } else openQuote(k); }
      else if (act === "open-quote-yes") openQuote(k);
      else if (act === "del-quote") { e.stopPropagation(); S.quoteConfirm = "del:" + k; renderSaved(); }
      else if (act === "del-quote-yes") { e.stopPropagation(); await deleteQuote(k); }
      else if (act === "cancel-confirm") { e.stopPropagation(); S.quoteConfirm = null; renderQuoteLines(); renderSaved(); }
    });
    document.addEventListener("click", (e) => { if (!e.target.closest("#q-combo")) { const ul = $("#q-results"); if (ul && !ul.hidden) { ul.hidden = true; } } });

    /* Référentiel */
    const vr = $("#view-referentiel");
    vr.addEventListener("input", (e) => {
      const t = e.target;
      if (t.id === "exc-q") { S.ref.excQ = t.value; renderRef(); return; }
      if (t.dataset.path && t.dataset.kind !== "sel" && t.dataset.kind !== "bool") onEditorInput(t);
      if (t.dataset.ci != null || t.dataset.cpath) { if (t.tagName !== "SELECT") onCatInput(t); }
    });
    vr.addEventListener("change", (e) => {
      const t = e.target;
      if (t.id === "imp-file" && t.files && t.files[0]) { readImport(t.files[0]); return; }
      if (t.dataset.path && (t.dataset.kind === "sel" || t.dataset.kind === "bool")) { onEditorInput(t); renderRef(); }
      if ((t.dataset.ci != null || t.dataset.cpath) && t.tagName === "SELECT") onCatInput(t);
    });
    vr.addEventListener("click", async (e) => {
      const a = e.target.closest("[data-act]");
      if (!a) return;
      const act = a.dataset.act;
      const w = S.ref.work;
      const blockIfDirty = () => { if (S.ref.dirty || S.ref.catDirty) { toast("Enregistrez ou annulez d'abord les modifications en cours", "err"); return true; } return false; };
      switch (act) {
        case "ref-tab": if (!blockIfDirty()) { S.ref.tab = a.dataset.v; S.ref.confirm = null; renderRef(); } break;
        case "sel-version": if (a.dataset.id !== S.ref.sel && !blockIfDirty()) { S.ref.sel = a.dataset.id; S.ref.work = null; S.ref.bad.clear(); S.ref.confirm = null; renderRef(); } break;
        case "new-version-open": S.ref.newOpen = true; renderRef(); setTimeout(() => { const i = $("#nv-label"); if (i) i.focus(); }, 0); break;
        case "new-version-cancel": S.ref.newOpen = false; renderRef(); break;
        case "new-version-create": if (!blockIfDirty()) await createVersion(); break;
        case "activate-version": S.ref.confirm = "activate"; renderRef(); break;
        case "activate-yes": await activateVersion(); break;
        case "del-version": S.ref.confirm = "del-version"; renderRef(); break;
        case "del-version-yes": await deleteVersion(); break;
        case "cancel-ref-confirm": S.ref.confirm = null; renderRef(); break;
        case "save-version": await saveVersion(); break;
        case "cancel-version": S.ref.work = null; S.ref.dirty = false; S.ref.bad.clear(); S.ref.remoteChanged = false; renderRef(); break;
        case "add-group": w.groupes.push({ id: "g-" + rid() + rid(), nom: "Nouveau groupe", libelleStrugal: "", prixKg: 0, colLaq: "PD" }); S.ref.dirty = true; renderRef(); break;
        case "del-group": w.groupes.splice(+a.dataset.i, 1); S.ref.dirty = true; renderRef(); break;
        case "add-finish": w.finitions.push({ id: "f-" + rid() + rid(), nom: "NOUVELLE FINITION", prix: { PD: 0, S70: 0, ECO: 0 } }); S.ref.dirty = true; renderRef(); break;
        case "del-finish": w.finitions.splice(+a.dataset.i, 1); S.ref.dirty = true; renderRef(); break;
        case "add-exc": { const p = S.idx.byKey.get(a.dataset.key); if (p) { w.exceptions = w.exceptions || {}; w.exceptions[p.key] = E.groupIdFor(w, p.serieId, p.ref) || (w.groupes[0] || {}).id; S.ref.excQ = ""; S.ref.dirty = true; renderRef(); } break; }
        case "del-exc": delete w.exceptions[a.dataset.k]; S.ref.dirty = true; renderRef(); break;
        case "sel-serie": if (a.dataset.id !== S.ref.catSel && !blockIfDirty()) { S.ref.catSel = a.dataset.id; S.ref.catWork = null; S.ref.bad.clear(); S.ref.confirm = null; renderRef(); } break;
        case "add-prof": S.ref.catWork.profils = S.ref.catWork.profils || []; S.ref.catWork.profils.push({ ref: "", refStrugal: null, designation: "", type: "Accessoire / complément", surface: 0.12, poids: 0, page: null, remarque: "" }); S.ref.catDirty = true; S.ref.bad.add("p" + (S.ref.catWork.profils.length - 1) + "poids"); renderRef(); break;
        case "del-prof": S.ref.catWork.profils.splice(+a.dataset.i, 1); S.ref.bad.clear(); S.ref.catDirty = true; renderRef(); break;
        case "save-cat": await saveCat(); break;
        case "cancel-cat": S.ref.catWork = null; S.ref.catDirty = false; S.ref.bad.clear(); renderRef(); break;
        case "add-serie": {
          if (blockIfDirty()) break;
          const nom = ($("#ns-nom").value || "").trim();
          if (!nom) { toast("Nom de série requis", "err"); break; }
          let id = slugId(nom);
          while (S.catDocs.has(id)) id = slugId(nom) + "-" + rid();
          const ordre = Math.max(0, ...S.idx.series.map((s) => s.ordre)) + 1;
          try { await S.db.doc("catalogue/" + id).set({ nom, famille: "Divers", ordre, description: "", remarque: "", profils: [], modifieLe: nowIso(), modifiePar: S.meId || null }); S.ref.catSel = id; S.ref.catWork = null; toast("Série « " + nom + " » créée"); } catch (er) { toast("Création impossible : " + errMsg(er), "err"); }
          renderRef();
          break;
        }
        case "del-serie": S.ref.confirm = "del-serie"; renderRef(); break;
        case "del-serie-yes": {
          const id = S.ref.catSel;
          S.ref.confirm = null;
          try { await S.db.doc("catalogue/" + id).delete(); S.catDocs.delete(id); rebuildIndex(); S.ref.catSel = null; S.ref.catWork = null; S.ref.catDirty = false; toast("Série supprimée"); await publishGrid(); } catch (er) { toast("Suppression impossible : " + errMsg(er), "err"); }
          renderRef();
          break;
        }
        case "publish": await publishGrid(); renderRef(); break;
        case "export-json": exportJson(); break;
        case "export-comptoir-html": exportComptoir("html"); break;
        case "export-comptoir-json": exportComptoir("json"); break;
        case "import-yes": await doImport(); break;
        case "import-cancel": S.ref.importData = null; renderRef(); break;
      }
    });
  }
  function resetQuote() {
    S.quote = newQuote();
    S.quote._v = Date.now();
    S.quoteDirty = false;
    S.quoteConfirm = null;
    S.copyText = null;
    persistDraft();
    renderAll();
  }
  function focusQty(i) {
    const inp = $('#q-lines tr[data-i="' + i + '"] input[data-li="qte"]');
    if (inp) { inp.focus(); inp.select(); }
    renderTop();
  }
  async function copyQuote() {
    const txt = quoteText();
    S.copyText = null;
    try { await navigator.clipboard.writeText(txt); toast("Récapitulatif copié"); }
    catch (e) { S.copyText = txt; renderTotals(calcQuote()); const ta = $("#copy-area"); if (ta) { ta.focus(); ta.select(); } }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

<script>
(function () {
  "use strict";
  var FINS = [["BLANC", 51], ["GIVRÉ", 54], ["FAUX BOIS", 60]];
  var L = 6, TVA = 0.2;
  var DEF = { public: 20, revendeur: 15, special: 10 };
  var TIERS = [["public", "Public"], ["revendeur", "Revendeur"], ["special", "Spécial"]];
  function f2(x) {
    try { return Number(x).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    catch (e) { return (Math.round(x * 100) / 100).toFixed(2); }
  }
  function load() { try { return JSON.parse(localStorage.getItem("alpha:marges") || "{}"); } catch (e) { return {}; } }
  function save(o) { try { localStorage.setItem("alpha:marges", JSON.stringify(o)); } catch (e) {} }
  function ovOf(ref) { var o = load(); return o[ref] || null; }

  window.alphaPriceBlock = function (p) {
    if (!p || !p.poids) return "";
    var ov = ovOf(p.ref), mg = ov || DEF, forced = !!ov;
    function cells(mult) {
      return FINS.map(function (f) {
        var v = p.poids * f[1] * L * mult;
        return '<td class="num">' + f2(v) + '</td><td class="num ttc">' + f2(v * (1 + TVA)) + "</td>";
      }).join("");
    }
    var rows = '<tr class="pv-achat"><td>Achat</td>' + cells(1) + "</tr>";
    TIERS.forEach(function (t) {
      rows += '<tr data-tier="' + t[0] + '"><td>' + t[1] + ' <span class="pv-pct">+' + mg[t[0]] + "%</span></td>" + cells(1 + mg[t[0]] / 100) + "</tr>";
    });
    var th = FINS.map(function (f) { return '<th class="num">' + f[0] + ' HT</th><th class="num ttc">' + f[0] + " TTC</th>"; }).join("");
    var inputs = TIERS.map(function (t) {
      return '<label>' + t[1] + ' <input class="pv-mg" data-t="' + t[0] + '" type="number" min="0" step="0.5" value="' + mg[t[0]] + '">%</label>';
    }).join("");
    return '<div class="pv-box" data-ref="' + p.ref + '" data-poids="' + p.poids + '">' +
      '<h3 class="small muted" style="margin:0 0 6px;text-transform:uppercase;letter-spacing:.05em">Achat &amp; vente · par barre de 6 m · DH' +
      (forced ? ' <span class="pv-forced">marge forcée</span>' : "") + "</h3>" +
      '<div class="tbl-wrap"><table class="grid"><thead><tr><th></th>' + th + "</tr></thead><tbody>" +
      rows + "</tbody></table></div>" +
      '<div class="pv-marges"><span class="pv-lbl">Forcer la marge :</span>' + inputs +
      '<button type="button" class="pv-btn" data-act="pv-save">Enregistrer</button>' +
      '<button type="button" class="pv-btn ghost" data-act="pv-reset">Défaut</button></div>' +
      '<div class="pv-note">La marge forcée est mémorisée dans ce navigateur et recalcule l’affichage (n’affecte pas le bouton « Ajouter au devis »).</div></div>';
  };

  function recompute(box) {
    var poids = parseFloat(box.getAttribute("data-poids"));
    box.querySelectorAll('tbody tr[data-tier]').forEach(function (tr) {
      var inp = box.querySelector('.pv-mg[data-t="' + tr.getAttribute("data-tier") + '"]');
      var m = parseFloat(inp.value) || 0, mult = 1 + m / 100;
      var tds = tr.querySelectorAll("td.num"), vals = [];
      FINS.forEach(function (f) { var v = poids * f[1] * L * mult; vals.push(v, v * (1 + TVA)); });
      tds.forEach(function (td, i) { td.textContent = f2(vals[i]); });
      var pct = tr.querySelector(".pv-pct"); if (pct) pct.textContent = "+" + m + "%";
    });
  }
  document.addEventListener("input", function (e) {
    var inp = e.target && e.target.closest ? e.target.closest(".pv-mg") : null;
    if (inp) { var box = inp.closest(".pv-box"); if (box) recompute(box); }
  });
  document.addEventListener("click", function (e) {
    var b = e.target && e.target.closest ? e.target.closest("[data-act]") : null; if (!b) return;
    var act = b.getAttribute("data-act"); if (act !== "pv-save" && act !== "pv-reset") return;
    var box = b.closest(".pv-box"); if (!box) return;
    var ref = box.getAttribute("data-ref"), o = load();
    if (act === "pv-save") {
      var m = {}; box.querySelectorAll(".pv-mg").forEach(function (i) { m[i.getAttribute("data-t")] = parseFloat(i.value) || 0; });
      o[ref] = m; save(o);
      if (!box.querySelector(".pv-forced")) box.querySelector("h3").insertAdjacentHTML("beforeend", ' <span class="pv-forced">marge forcée</span>');
    } else {
      delete o[ref]; save(o);
      box.querySelectorAll(".pv-mg").forEach(function (i) { i.value = DEF[i.getAttribute("data-t")]; });
      recompute(box);
      var fb = box.querySelector(".pv-forced"); if (fb) fb.remove();
    }
  });
})();

</script>
<script>
/* Devis PDF client — commun aux pages Strugal et Alpha Group.
   Construit un document A4 dédié puis appelle window.print() : le navigateur
   produit le PDF (« Enregistrer au format PDF »), sans dépendance externe.
   Dépend de window.sypQuoteData() (exposé dans la page) et, en option,
   de window.SYP_UNIT(ref, qte) pour l'unité de quantité. */
(function () {
  "use strict";
  var SOC = {
    nom: "SYPRAMED",
    activite: "Comptoir de Vente des Profilés Aluminium & Accessoires",
    adresse: "Lot Al Kasr N° 12, Skhirat — Maroc",
    tel: "+212 5 37 64 32 73",
    gsm: "+212 6 61 91 08 93",
    mail: "contact@sypramed.ma",
    site: "sypramed.ma"
  };
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function f2(x){ try{return Number(x).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});}catch(e){return (Math.round(x*100)/100).toFixed(2);} }
  var U9 = ["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze",
            "treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
  var D9 = ["","","vingt","trente","quarante","cinquante","soixante","soixante","quatre-vingt","quatre-vingt"];
  function sousCent(n){
    if (n < 20) return U9[n];
    var d = Math.floor(n/10), u = n%10;
    if (d===7||d===9) return D9[d] + ((d===7&&u===1)?"-et-":"-") + U9[10+u];
    if (u===0) return D9[d] + (d===8?"s":"");
    if (u===1&&d!==8) return D9[d] + "-et-un";
    return D9[d] + "-" + U9[u];
  }
  function sousMille(n){
    if (n < 100) return sousCent(n);
    var c = Math.floor(n/100), r = n%100;
    var t = (c>1 ? U9[c]+" cent" : "cent");
    return r===0 ? t + (c>1?"s":"") : t + " " + sousCent(r);
  }
  function enLettres(n){
    n = Math.floor(Math.abs(n));
    if (!n) return "zéro";
    var out = "", mi = Math.floor(n/1e6); n %= 1e6;
    var ml = Math.floor(n/1e3); n %= 1e3;
    if (mi) out += (mi>1 ? sousMille(mi)+" millions" : "un million") + " ";
    if (ml) out += (ml>1 ? sousMille(ml)+" mille" : "mille") + " ";
    if (n)  out += sousMille(n);
    return out.replace(/\s+/g," ").trim();
  }
  function frDate(iso){
    if (!iso) return "";
    var p = String(iso).split("-");
    return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : iso;
  }
  function logoSrc(){
    var i = document.querySelector('.topbar img, header img, img[src^="data:image"]');
    return i ? i.getAttribute("src") : "";
  }
  function uniteDe(ref, qte){
    if (typeof window.SYP_UNIT === "function") { var u = window.SYP_UNIT(ref, qte); if (u) return u; }
    return "barre" + (qte > 1 ? "s" : "");
  }

  window.sypDevisPDF = function () {
    var d = (typeof window.sypQuoteData === "function") ? window.sypQuoteData() : null;
    if (!d) { alert("Devis indisponible."); return; }
    if (!d.lignes.length) { alert("Le devis est vide."); return; }
    var old = document.getElementById("syp-print");
    if (old) old.parentNode.removeChild(old);

    var rows = d.lignes.map(function (l, i) {
      return '<tr><td class="c">'+(i+1)+'</td><td class="mono">'+esc(l.ref)+'</td>'+
             '<td>'+esc(l.designation)+(l.serie?'<span class="sub">'+esc(l.serie)+'</span>':'')+'</td>'+
             '<td>'+esc(l.finition)+'</td>'+
             '<td class="r">'+l.qte+' <span class="sub">'+esc(uniteDe(l.ref, l.qte))+'</span></td>'+
             '<td class="r">'+f2(l.puHT)+'</td><td class="r b">'+f2(l.montantHT)+'</td></tr>';
    }).join("");

    var cent = Math.round((d.totals.ttc - Math.floor(d.totals.ttc)) * 100);
    var lettres = enLettres(d.totals.ttc) + " dirhams" + (cent ? " et " + enLettres(cent) + " centimes" : "");

    var html =
      '<div class="syp-head">'+
        '<div class="syp-id">'+(logoSrc()?'<img src="'+logoSrc()+'" alt="'+esc(SOC.nom)+'">':'<div class="syp-nom">'+esc(SOC.nom)+'</div>')+
          '<div class="syp-coord"><b>'+esc(SOC.nom)+'</b><br>'+esc(SOC.activite)+'<br>'+esc(SOC.adresse)+
          '<br>Tél. '+esc(SOC.tel)+' · GSM '+esc(SOC.gsm)+'<br>'+esc(SOC.mail)+' · '+esc(SOC.site)+'</div>'+
        '</div>'+
        '<div class="syp-meta"><div class="syp-titre">DEVIS</div>'+
          '<table><tr><th>N°</th><td>'+esc(d.numero||"—")+'</td></tr>'+
          '<tr><th>Date</th><td>'+esc(frDate(d.date))+'</td></tr>'+
          '<tr><th>Tarif</th><td>'+esc(d.tarif||"")+'</td></tr></table>'+
        '</div>'+
      '</div>'+
      '<div class="syp-client"><div><span class="k">Client</span><b>'+esc(d.client||"—")+'</b>'+
        (d.tel?'<br><span class="k">Tél.</span>'+esc(d.tel):'')+'</div>'+
        '<div>'+(d.projet?'<span class="k">Projet / chantier</span>'+esc(d.projet):'')+'</div></div>'+
      '<table class="syp-lines"><thead><tr><th class="c">#</th><th>Réf.</th><th>Désignation</th>'+
        '<th>Finition</th><th class="r">Qté</th><th class="r">P.U. HT</th><th class="r">Montant HT</th></tr></thead>'+
        '<tbody>'+rows+'</tbody></table>'+
      '<div class="syp-bas">'+
        '<div class="syp-lettres"><b>Arrêté le présent devis à la somme de :</b><br>'+esc(lettres)+' TTC.'+
          (d.note?'<div class="syp-note">'+esc(d.note)+'</div>':'')+'</div>'+
        '<table class="syp-tot"><tr><th>Total HT</th><td>'+f2(d.totals.ht)+' DH</td></tr>'+
          '<tr><th>TVA '+Math.round((d.tva||0.2)*100)+' %</th><td>'+f2(d.totals.tva)+' DH</td></tr>'+
          '<tr class="ttc"><th>Total TTC</th><td>'+f2(d.totals.ttc)+' DH</td></tr></table>'+
      '</div>'+
      '<div class="syp-cond">Devis valable 15 jours · Prix en dirhams, '+esc(d.tier)+
        ' · Marchandise payable avant livraison sauf accord écrit.</div>'+
      '<div class="syp-sign"><div>Cachet et signature du client<br><span class="sub">précédés de « Bon pour accord »</span></div>'+
        '<div>Pour '+esc(SOC.nom)+'</div></div>';

    var box = document.createElement("div");
    box.id = "syp-print";
    box.innerHTML = html;
    document.body.appendChild(box);
    setTimeout(function () { window.print(); }, 60);
  };

  document.addEventListener("click", function (e) {
    var b = e.target && e.target.closest ? e.target.closest('[data-act="pdf-quote"]') : null;
    if (b) { e.preventDefault(); window.sypDevisPDF(); }
  });
})();

</script>
</body></html>
