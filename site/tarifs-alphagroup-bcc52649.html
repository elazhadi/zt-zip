<!doctype html>
<html lang="fr"><head><meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tarification Profilés Alpha Group</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"><style>body{margin:0}[hidden]{display:none!important}

/* Layout : barre anthracite collante + plan de travail aluminium ; filtres à gauche, tableaux dans des panneaux, fiche profilé en tiroir à droite */
:root {
  --bg: #eceff1;
  --surface: #ffffff;
  --surface-2: #f5f7f8;
  --ink: #22292d;
  --muted: #5b676d;
  --line: #d2d9dd;
  --line-strong: #b4bec3;
  --bar: #2e3539;
  --bar-2: #3a4247;
  --bar-ink: #eef2f4;
  --bar-muted: #a9b4ba;
  --accent: #0b5aa2;
  --accent-ink: #ffffff;
  --accent-soft: #e1ecf7;
  --ttc: #0c6a4e;
  --ttc-soft: #e4f2ec;
  --warn: #9a4d07;
  --warn-soft: #fbecd8;
  --danger: #b42318;
  --danger-soft: #fdeceb;
  --ok: #1b7444;
  --focus: #e39b00;
  --tier-public: #5b676d;
  --tier-revendeur: #0b5aa2;
  --tier-special: #9a4d07;
  --shadow: 0 1px 2px rgba(18, 28, 33, 0.06), 0 10px 28px rgba(18, 28, 33, 0.1);
  --scrim: rgba(20, 26, 29, 0.42);
  --f-display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-code: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111518; --surface: #181e21; --surface-2: #1e2529; --ink: #e3e8eb; --muted: #98a4aa; --line: #2b3439; --line-strong: #3c474d;
    --bar: #0b0f11; --bar-2: #1a2125; --bar-ink: #e3e8eb; --bar-muted: #8e9aa1;
    --accent: #5ea6ea; --accent-ink: #08131d; --accent-soft: #15304a; --ttc: #5fc79f; --ttc-soft: #12322a;
    --warn: #f0a557; --warn-soft: #3a2611; --danger: #ff7c70; --danger-soft: #3d1714; --ok: #5fc79f; --focus: #ffc23d;
    --tier-public: #98a4aa; --tier-revendeur: #5ea6ea; --tier-special: #f0a557;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 28px rgba(0, 0, 0, 0.4); --scrim: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111518; --surface: #181e21; --surface-2: #1e2529; --ink: #e3e8eb; --muted: #98a4aa; --line: #2b3439; --line-strong: #3c474d;
  --bar: #0b0f11; --bar-2: #1a2125; --bar-ink: #e3e8eb; --bar-muted: #8e9aa1;
  --accent: #5ea6ea; --accent-ink: #08131d; --accent-soft: #15304a; --ttc: #5fc79f; --ttc-soft: #12322a;
  --warn: #f0a557; --warn-soft: #3a2611; --danger: #ff7c70; --danger-soft: #3d1714; --ok: #5fc79f; --focus: #ffc23d;
  --tier-public: #98a4aa; --tier-revendeur: #5ea6ea; --tier-special: #f0a557;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 28px rgba(0, 0, 0, 0.4); --scrim: rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-ui); font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--f-code); font-weight: 500; letter-spacing: 0.01em; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.num { text-align: right; white-space: nowrap; }
.nowrap { white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Barre supérieure ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); color: var(--bar-ink); border-bottom: 1px solid #00000033; }
.topbar-in { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
.brand svg { flex: none; }
.brand-name { font-family: var(--f-display); font-stretch: 118%; font-weight: 800; font-size: 17px; letter-spacing: 0.01em; line-height: 1.1; }
.brand-sub { color: var(--bar-muted); font-size: 12px; }
.tabs { display: flex; gap: 2px; background: var(--bar-2); padding: 3px; border-radius: 8px; }
.tabs a { color: var(--bar-ink); text-decoration: none; padding: 6px 14px; border-radius: 6px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.tabs a[aria-current="page"] { background: var(--surface); color: var(--ink); }
.tabs a:hover:not([aria-current="page"]) { background: #ffffff14; }
.cart { font-family: var(--f-code); font-size: 11px; background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 1px 6px; }
.tierbar { display: flex; align-items: center; gap: 8px; }
.tierbar .lbl { color: var(--bar-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
.seg { display: inline-flex; background: var(--bar-2); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--bar-ink); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.t-public { background: var(--tier-public); } .dot.t-revendeur { background: var(--tier-revendeur); } .dot.t-special { background: var(--tier-special); } .dot.t-x { background: var(--muted); }

.statusline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding-block: 10px; color: var(--muted); font-size: 13px; }
.statusline b { color: var(--ink); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--ink); white-space: nowrap; }
.pill.warn { border-color: transparent; background: var(--warn-soft); color: var(--warn); }
.pill.ok { border-color: transparent; background: var(--ttc-soft); color: var(--ttc); }
.pill.danger { border-color: transparent; background: var(--danger-soft); color: var(--danger); }
.pill.acc { border-color: transparent; background: var(--accent-soft); color: var(--accent); }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-weight: 600; font-size: 13px; text-decoration: underline; text-underline-offset: 2px; }

main { padding-bottom: 48px; }
.view { display: block; }
.empty { background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--r); padding: 28px; text-align: center; color: var(--muted); }
.empty h2 { font-family: var(--f-display); font-stretch: 112%; color: var(--ink); font-size: 18px; margin: 0 0 6px; text-wrap: balance; }

/* ---------- Boutons, champs ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: var(--r); padding: 7px 12px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { padding: 4px 8px; font-size: 12px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.iconbtn { width: 30px; height: 30px; padding: 0; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); font-size: 16px; line-height: 1; }
.iconbtn:hover { border-color: var(--accent); color: var(--accent); }
.iconbtn.add { color: var(--accent); font-weight: 700; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; color: var(--muted); font-weight: 500; }
.inp, select.inp, textarea.inp { width: 100%; min-width: 0; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r); padding: 7px 10px; }
.inp:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.inp.num { text-align: right; }
.inp.tiny { padding: 4px 6px; }
.inp.bad { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
.inp[readonly], .inp:disabled { background: var(--surface-2); color: var(--muted); }
.search { position: relative; }
.search .inp { padding-left: 34px; height: 40px; font-size: 15px; }
.search svg { position: absolute; left: 11px; top: 12px; color: var(--muted); }
.toggle { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.toggle button { border: 0; background: transparent; padding: 6px 10px; cursor: pointer; font-weight: 600; color: var(--muted); }
.toggle button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.toggle button + button { border-left: 1px solid var(--line); }

/* Pastilles de finition (rendu physique : mêmes couleurs dans les deux thèmes) */
.sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line-strong); display: inline-block; vertical-align: -2px; flex: none; }
.sw-brut { background: linear-gradient(135deg, #c3c9cc, #eef1f2 45%, #a9b1b5); }
.sw-blanc { background: #f8f8f5; }
.sw-noir { background: radial-gradient(#444 1px, #141414 1.6px) 0 0 / 3px 3px; }
.sw-lisse { background: conic-gradient(#b23a2b 0 25%, #2c5a88 0 50%, #3c774a 0 75%, #d6b046 0); }
.sw-givre { background: radial-gradient(rgba(255, 255, 255, 0.6) 1px, transparent 1.6px) 0 0 / 4px 4px, #56616b; }
.sw-metal { background: linear-gradient(135deg, #858f95, #e0e5e8 50%, #737d83); }
.sw-quartz { background: radial-gradient(#a2a8ac 1px, transparent 1.6px) 0 0 / 3px 3px, #454b4f; }
.sw-cerezo { background: linear-gradient(90deg, #763820, #9c5534 45%, #763820); }
.sw-bois { background: repeating-linear-gradient(100deg, #87572f 0 2px, #a8733e 2px 5px, #774b29 5px 6px); }
.sw-anod { background: linear-gradient(135deg, #b4bbbf, #eaedef 50%, #adb4b8); }
.sw-autre { background: var(--line); }

/* ---------- Tarif ---------- */
.tarif { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; }
.filters { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); max-height: calc(100vh - 90px); overflow: auto; }
.filters h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
.filters h3:first-child { margin-top: 0; }
.fhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.chk { display: flex; align-items: center; gap: 8px; padding: 3px 4px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.chk:hover { background: var(--surface-2); }
.chk input { accent-color: var(--accent); margin: 0; }
.chk .c { margin-left: auto; color: var(--muted); font-size: 12px; font-family: var(--f-code); }
.chk.zero { opacity: 0.45; }
.serlist { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 4px; padding: 4px; }
.sergrp { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; padding: 6px 4px 2px; }
.ftoggle { display: none; }
.tmain { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.toolbar .search { flex: 1 1 280px; }
.toolbar .field { flex: 0 0 auto; }
.finsel { min-width: 210px; }
.resultbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 12px; }
.chip button { border: 0; background: var(--surface-2); border-radius: 50%; width: 18px; height: 18px; cursor: pointer; color: var(--muted); line-height: 1; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.tscroll { overflow: auto; max-height: calc(100vh - 230px); border-radius: var(--r); }
table.grid { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
table.grid th { position: sticky; top: 0; z-index: 2; background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
table.grid th.num { text-align: right; }
table.grid th button.sort { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
table.grid th button.sort:focus-visible { outline: 2px solid var(--focus); }
table.grid td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.grid tbody tr:last-child td { border-bottom: 0; }
table.grid tbody tr.row { cursor: pointer; }
table.grid tbody tr.row:hover td { background: var(--accent-soft); }
table.grid td.ttc, table.grid th.ttc { background: var(--ttc-soft); }
table.grid td.ttc { color: var(--ttc); font-weight: 700; }
table.grid th.ttc { color: var(--ttc); }
table.grid td.ht { font-weight: 600; }
.refcell .mono { font-size: 13.5px; font-weight: 600; }
.sub { display: block; font-size: 11.5px; color: var(--muted); }
.adm { color: var(--muted); }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; font-weight: 600; }
.tag.exc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

/* ---------- Tiroir fiche profilé ---------- */
.supswitch{display:inline-flex;gap:2px;background:var(--bar-2);border-radius:999px;padding:3px;margin-left:8px}.supswitch a{font:600 12px var(--f-ui);color:var(--bar-muted);padding:5px 13px;border-radius:999px;text-decoration:none;white-space:nowrap}.supswitch a.active{background:var(--surface);color:var(--ink)}.supswitch a:not(.active):hover{color:var(--bar-ink)}#q-lines [data-c="poids"]{display:none!important}#syp-print{display:none}@media print{ html,body{background:#fff!important} body>*:not(#syp-print){display:none!important} #syp-print{display:block!important;position:static;background:#fff;color:#111;font:12px/1.45 "Helvetica Neue",Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact} @page{size:A4;margin:12mm} #syp-print .syp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;border-bottom:2px solid #1f2a37;padding-bottom:10px} #syp-print .syp-id{display:flex;gap:12px;align-items:flex-start} #syp-print .syp-id img{height:38px;width:auto} #syp-print .syp-nom{font-size:20px;font-weight:800;letter-spacing:.04em} #syp-print .syp-coord{font-size:10.5px;line-height:1.5;color:#333} #syp-print .syp-titre{font-size:24px;font-weight:800;letter-spacing:.12em;text-align:right;color:#1f2a37} #syp-print .syp-meta table{margin-left:auto;margin-top:6px;border-collapse:collapse;font-size:11px} #syp-print .syp-meta th{text-align:left;padding:1px 10px 1px 0;color:#555;font-weight:600} #syp-print .syp-meta td{padding:1px 0;font-weight:700} #syp-print .syp-client{display:flex;gap:24px;margin:12px 0;padding:9px 11px;background:#f3f5f7;border-radius:5px;font-size:11.5px} #syp-print .syp-client .k{display:inline-block;min-width:58px;margin-right:8px;color:#666} #syp-print table.syp-lines{width:100%;border-collapse:collapse;font-size:11px;margin-top:4px} #syp-print table.syp-lines thead{display:table-header-group} #syp-print table.syp-lines tr{page-break-inside:avoid} #syp-print table.syp-lines th{background:#1f2a37;color:#fff;padding:5px 6px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em} #syp-print table.syp-lines td{padding:5px 6px;border-bottom:1px solid #dde2e7;vertical-align:top} #syp-print table.syp-lines tbody tr:nth-child(even) td{background:#fafbfc} #syp-print .mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:10.5px} #syp-print .sub{display:block;color:#777;font-size:9.5px} #syp-print td.r,#syp-print th.r{text-align:right} #syp-print td.c,#syp-print th.c{text-align:center} #syp-print td.b{font-weight:700} #syp-print .syp-bas{display:flex;justify-content:space-between;gap:20px;margin-top:12px;page-break-inside:avoid} #syp-print .syp-lettres{font-size:11px;max-width:58%} #syp-print .syp-note{margin-top:6px;color:#555;font-style:italic} #syp-print table.syp-tot{border-collapse:collapse;font-size:12px;min-width:210px} #syp-print table.syp-tot th{text-align:left;padding:4px 14px 4px 0;color:#444;font-weight:600} #syp-print table.syp-tot td{text-align:right;padding:4px 0;font-weight:700;white-space:nowrap} #syp-print table.syp-tot tr.ttc th,#syp-print table.syp-tot tr.ttc td{border-top:2px solid #1f2a37;font-size:14px;padding-top:6px} #syp-print .syp-cond{margin-top:14px;padding-top:7px;border-top:1px solid #dde2e7;font-size:10px;color:#555} #syp-print .syp-sign{display:flex;justify-content:space-between;gap:20px;margin-top:22px;font-size:10.5px;page-break-inside:avoid} #syp-print .syp-sign>div{flex:1;border-top:1px solid #9aa4ae;padding-top:5px} #syp-print .syp-sign>div:last-child{text-align:right}}.pv-box{margin:0 0 4px}.pv-box + div{display:none}.pv-forced{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;color:#9a4d07;background:#fbecd8;padding:2px 7px;border-radius:999px;text-transform:none;letter-spacing:0;vertical-align:middle}.pv-marges{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:10px 0 0;font-size:12px}.pv-marges .pv-lbl{color:var(--muted);font-weight:600}.pv-marges label{display:inline-flex;align-items:center;gap:4px;color:var(--ink)}.pv-marges input{width:54px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font:inherit;text-align:right;background:var(--surface);color:var(--ink)}.pv-btn{font:600 12px var(--f-ui);padding:6px 11px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}.pv-btn.ghost{background:transparent;color:var(--accent)}.pv-pct{font-size:11px;color:var(--muted);font-weight:600}.pv-note{font-size:11px;color:var(--muted);margin:6px 0 0}.prof-draw{margin:0 0 14px;text-align:center}.prof-draw img{max-width:100%;max-height:200px;height:auto;display:block;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;box-sizing:border-box}.prof-draw .cap{font-size:11px;color:var(--muted);margin-top:6px}
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: var(--surface); z-index: 41; box-shadow: var(--shadow); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.dhead { display: flex; gap: 12px; align-items: start; justify-content: space-between; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.dref { font-family: var(--f-code); font-size: 26px; font-weight: 600; line-height: 1; }
.dtitle { font-family: var(--f-display); font-stretch: 108%; font-size: 17px; font-weight: 700; margin-top: 6px; text-wrap: balance; }
.dbody { overflow: auto; padding: 14px 18px 22px; display: flex; flex-direction: column; gap: 16px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.fact { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; }
.fact .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.fact .v { font-size: 16px; font-weight: 600; }
.note { border-left: 3px solid var(--warn); background: var(--warn-soft); color: var(--ink); padding: 8px 10px; border-radius: 0 var(--r) var(--r) 0; font-size: 13px; }
.note.info { border-left-color: var(--accent); background: var(--accent-soft); }
.addbox { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); }

/* ---------- Devis ---------- */
.devis { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.card h2, .card h3 { font-family: var(--f-display); font-stretch: 110%; font-size: 15px; margin: 0 0 10px; font-weight: 700; }
.qhead { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.combo { position: relative; }
.combo ul { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 15; list-style: none; margin: 0; padding: 4px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r); box-shadow: var(--shadow); max-height: 340px; overflow: auto; }
.combo li { padding: 7px 8px; border-radius: 4px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
.combo li[aria-selected="true"], .combo li:hover { background: var(--accent-soft); }
.combo li .mono { min-width: 54px; font-weight: 600; }
.combo li .s { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
.qtyinp { width: 76px; }
select.inp.linefin { min-width: 150px; }
.side { display: flex; flex-direction: column; gap: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); }
.totals { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; }
.totals .big { font-family: var(--f-display); font-stretch: 105%; font-size: 24px; font-weight: 800; color: var(--ttc); }
.totals .sep { grid-column: 1 / -1; border-top: 1px solid var(--line); margin: 4px 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.qlist { display: flex; flex-direction: column; gap: 6px; max-height: 420px; overflow: auto; }
.qitem { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; cursor: pointer; background: var(--surface); text-align: left; }
.qitem:hover { border-color: var(--accent); }
.qitem.cur { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.qitem .t { font-weight: 600; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--r); background: var(--warn-soft); color: var(--ink); font-size: 13px; }

/* ---------- Référentiel ---------- */
.subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.subtabs button { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; color: var(--muted); }
.subtabs button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.refgrid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
.vlist { display: flex; flex-direction: column; gap: 8px; }
.vitem { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 12px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.vitem.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.vitem .l { font-family: var(--f-display); font-stretch: 110%; font-weight: 800; font-size: 16px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec + .sec { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.sec h3 { margin: 0; font-family: var(--f-display); font-stretch: 110%; font-size: 15px; font-weight: 700; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sec h3 small { font-family: var(--f-ui); font-weight: 400; font-size: 12px; color: var(--muted); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table.edit { border-collapse: collapse; width: 100%; font-size: 13px; }
table.edit th { background: var(--surface-2); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; text-align: left; padding: 7px 8px; font-weight: 600; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.edit td { padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.edit tr:last-child td { border-bottom: 0; }
table.edit .inp { padding: 5px 7px; }
.w-num { width: 96px; }
.w-pct { width: 74px; }
.formgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 14px; }
.chkline { display: flex; align-items: center; gap: 8px; }
.chkline input { accent-color: var(--accent); width: 16px; height: 16px; }
.savebar { position: sticky; bottom: max(12px, env(safe-area-inset-bottom, 0px)); z-index: 12; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; background: var(--ink); color: var(--surface); border-radius: 8px; padding: 10px 14px; margin-top: 16px; box-shadow: var(--shadow); }
.savebar .btn { border-color: transparent; }
.delta.up { color: var(--danger); } .delta.down { color: var(--ok); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 600; }

/* ---------- Notifications ---------- */
.toasts { position: fixed; z-index: 60; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: 8px; box-shadow: var(--shadow); font-size: 13px; }
.toast.err { background: var(--danger); color: #fff; }

/* ---------- Responsive ---------- */
@media (max-width: 1080px) {
  .devis { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; }
  .refgrid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .tarif { grid-template-columns: minmax(0, 1fr); }
  .filters { position: static; max-height: none; display: none; }
  .filters.open { display: block; }
  .ftoggle { display: inline-flex; }
  .tscroll { max-height: none; }
  .hide-m { display: none; }
  .brand-sub { display: none; }
}
@media (max-width: 560px) {
  .topbar-in { gap: 8px; }
  .tabs { order: 3; width: 100%; justify-content: stretch; }
  .tabs a { flex: 1; justify-content: center; padding: 6px 8px; }
  .tierbar { order: 2; }
  .tierbar .lbl { display: none; }
  .seg button { padding: 5px 8px; font-size: 13px; }
  .hide-s { display: none; }
  .dref { font-size: 22px; }
  .toolbar .search { flex-basis: 100%; }
  table.grid th, table.grid td { padding: 7px 6px; }
  table.grid th { white-space: normal; letter-spacing: 0.02em; }
  #tf-table .addcol { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slidein 0.18s ease-out; }
  @keyframes slidein { from { transform: translateX(24px); } to { transform: none; } }
}

<script>
/* Moteur de calcul : fonctions pures, sans DOM (testé à part sous Node). */
const Engine = (() => {
  const round2 = (x) => Math.round(+(x * 100).toPrecision(15)) / 100;
  const roundStep = (x, step) => {
    if (!step || step <= 0.01) return round2(x);
    return round2(Math.round(+(x / step).toPrecision(15)) * step);
  };
  const ceilSafe = (x) => Math.ceil(+x.toPrecision(12));

  /* Catalogue : documents série -> index des profilés */
  function buildIndex(catDocs) {
    const series = catDocs
      .map((d) => ({
        id: d.id,
        nom: (d.data && d.data.nom) || d.id,
        famille: (d.data && d.data.famille) || "Divers",
        ordre: +(d.data && d.data.ordre) || 999,
        description: (d.data && d.data.description) || "",
        remarque: (d.data && d.data.remarque) || "",
        profils: Array.isArray(d.data && d.data.profils) ? d.data.profils : [],
      }))
      .sort((a, b) => a.ordre - b.ordre || a.nom.localeCompare(b.nom));
    const profiles = [];
    const byKey = new Map();
    const byRef = new Map();
    series.forEach((s, si) =>
      s.profils.forEach((p, pi) => {
        if (!p || !p.ref) return;
        const pr = {
          key: s.id + "|" + p.ref,
          serieId: s.id,
          serie: s.nom,
          famille: s.famille,
          ordre: si * 1000 + pi,
          ref: String(p.ref),
          refStrugal: p.refStrugal || "",
          designation: p.designation || "",
          type: p.type || "Autre",
          surface: +p.surface || 0,
          poids: +p.poids || 0,
          page: p.page || null,
          remarque: p.remarque || "",
        };
        if (byKey.has(pr.key)) return;
        profiles.push(pr);
        byKey.set(pr.key, pr);
        if (!byRef.has(pr.ref)) byRef.set(pr.ref, pr);
      })
    );
    return { series, profiles, byKey, byRef };
  }

  function groupIdFor(v, serieId, ref) {
    return (v.exceptions && v.exceptions[serieId + "|" + ref]) || (v.series && v.series[serieId]) || null;
  }
  function tierRate(v, tierId, gid) {
    const m = v.marges || {};
    const o = m.parGroupe && m.parGroupe[gid];
    if (o && typeof o[tierId] === "number") return o[tierId];
    const t = (m.tiers || []).find((x) => x.id === tierId);
    return t && typeof t.taux === "number" ? t.taux : 0;
  }
  function applyMargin(cost, rate, methode) {
    if (methode === "vente") return rate < 1 ? cost / (1 - rate) : cost;
    return cost * (1 + rate);
  }

  /* Coût d'achat brut d'une barre (non arrondi). m = 1 : majoré (< seuil). */
  function rawBarCost(v, p, g, f, m) {
    const c = v.conditions || {};
    const L = +c.longueurBarre || 6;
    const base = c.baseLaquage === "kg" ? p.poids : p.surface;
    const laq = f && f.prix && typeof f.prix[g.colLaq] === "number" ? f.prix[g.colLaq] : 0;
    return (p.poids * (g.prixKg + (m ? +c.majoration || 0 : 0)) + base * laq) * L;
  }

  /* Table de prix complète (vente par tranche + coût) à partir d'une version de tarif. */
  function buildPriceTable(v, idx, versionId) {
    const c = v.conditions || {};
    const fins = (v.finitions || []).map((f) => ({ id: f.id, nom: f.nom }));
    const tiers = ((v.marges && v.marges.tiers) || []).map((t) => ({ id: t.id, nom: t.nom }));
    const groups = new Map((v.groupes || []).map((g) => [g.id, g]));
    const step = +((v.marges && v.marges.arrondi) || 0.01);
    const methode = (v.marges && v.marges.methode) || "cout";
    const F = fins.length;
    const T = tiers.length;
    const prix = new Map();
    const cout = new Map();
    const grp = new Map();
    for (const p of idx.profiles) {
      const gid = groupIdFor(v, p.serieId, p.ref);
      const g = groups.get(gid);
      if (!g) continue;
      grp.set(p.key, gid);
      const sale = new Array(F * T * 2);
      const cst = new Array(F * 2);
      for (let fi = 0; fi < F; fi++) {
        const f = v.finitions[fi];
        for (let m = 0; m < 2; m++) {
          const raw = rawBarCost(v, p, g, f, m);
          cst[fi * 2 + m] = round2(raw);
          for (let ti = 0; ti < T; ti++) {
            sale[(fi * T + ti) * 2 + m] = roundStep(applyMargin(raw, tierRate(v, tiers[ti].id, gid), methode), step);
          }
        }
      }
      prix.set(p.key, sale);
      cout.set(p.key, cst);
    }
    return {
      versionId: versionId || null,
      label: v.label || "",
      dateEffet: v.dateEffet || "",
      finitions: fins,
      tiers,
      F,
      T,
      tva: +c.tva || 0,
      seuilKg: +c.seuilKg || 0,
      majoration: +c.majoration || 0,
      longueurBarre: +c.longueurBarre || 6,
      modeSeuil: c.modeSeuil || "ref-finition",
      appliquerMaj: c.appliquerMajoration !== false,
      exemple: !!(v.marges && v.marges.exemple),
      methode,
      prix,
      cout,
      grp,
    };
  }

  /* Grille de vente publiée (lisible par les agents, sans les coûts). */
  function gridFromPT(pt, idx, stamp) {
    const meta = {
      versionId: pt.versionId,
      label: pt.label,
      dateEffet: pt.dateEffet,
      finitions: pt.finitions,
      tiers: pt.tiers,
      tva: pt.tva,
      seuilKg: pt.seuilKg,
      majoration: pt.majoration,
      longueurBarre: pt.longueurBarre,
      modeSeuil: pt.modeSeuil,
      appliquerMaj: pt.appliquerMaj,
      exemple: !!pt.exemple,
      stamp: stamp || "",
      series: idx.series.map((s) => s.id),
    };
    const docs = {};
    for (const s of idx.series) {
      const prix = {};
      for (const p of s.profils) {
        const arr = pt.prix.get(s.id + "|" + p.ref);
        if (arr) prix[p.ref] = arr;
      }
      docs[s.id] = { versionId: pt.versionId, prix };
    }
    return { meta, docs };
  }
  function ptFromGrid(meta, gridDocs) {
    const prix = new Map();
    for (const [sid, d] of gridDocs) {
      if (!d || d.versionId !== meta.versionId) continue;
      const px = d.prix || {};
      for (const ref of Object.keys(px)) prix.set(sid + "|" + ref, px[ref]);
    }
    const finitions = meta.finitions || [];
    const tiers = meta.tiers || [];
    return {
      versionId: meta.versionId,
      label: meta.label || "",
      dateEffet: meta.dateEffet || "",
      finitions,
      tiers,
      F: finitions.length,
      T: tiers.length,
      tva: +meta.tva || 0,
      seuilKg: +meta.seuilKg || 0,
      majoration: +meta.majoration || 0,
      longueurBarre: +meta.longueurBarre || 6,
      modeSeuil: meta.modeSeuil || "ref-finition",
      appliquerMaj: meta.appliquerMaj !== false,
      exemple: !!meta.exemple,
      prix,
      cout: null,
      grp: null,
    };
  }

  function salePrice(pt, key, fi, ti, maj) {
    const a = pt.prix.get(key);
    if (!a || fi < 0 || ti < 0) return null;
    const x = a[(fi * pt.T + ti) * 2 + (maj ? 1 : 0)];
    return typeof x === "number" ? x : null;
  }
  function costPrice(pt, key, fi, maj) {
    if (!pt.cout) return null;
    const a = pt.cout.get(key);
    if (!a || fi < 0) return null;
    const x = a[fi * 2 + (maj ? 1 : 0)];
    return typeof x === "number" ? x : null;
  }
  const ttc = (pt, ht) => (ht == null ? null : round2(ht * (1 + pt.tva)));
  const minBars = (pt, p) => (p && p.poids > 0 ? ceilSafe(pt.seuilKg / (p.poids * pt.longueurBarre)) : null);

      bits.push('<button type="button" class="linkbtn" data-act="toggle-counter">' + (S.counterView ? "Revenir à la vue administrateur" : "Voir comme un agent") + "</button>");

      if (av && av.v.marges && av.v.marges.exemple) bits.push('<span class="pill warn">Marges d\'exemple (30 / 20 / 10 %) : à paramétrer</span>');
      if (S.publishing) bits.push('<span class="pill acc">Publication de la grille…</span>');
      else if (S.gridUpToDate === false) bits.push('<span class="pill warn">Grille des agents pas à jour</span> <button type="button" class="linkbtn" data-act="publish">Publier</button>');
      else if (S.gridUpToDate === true) bits.push('<span class="pill ok">Grille des agents à jour</span>');
    }
    el.innerHTML = bits.join("");
  }

  function emptyBlock(title, text, btn) {
    return '<div class="empty"><h2>' + esc(title) + "</h2><p>" + esc(text) + "</p>" + (btn || "") + "</div>";
  }
  function dataGate() {
    if (S.dbState === "loading" || (S.dbState === "ready" && (!S.loaded.cat || !S.loaded.vente || (S.isAdmin && (!S.loaded.tarifs || !S.loaded.config)))))
      return emptyBlock("Chargement du référentiel", "Le catalogue des profilés et la grille de prix arrivent. Ils s'affichent ici dès qu'ils sont chargés.");
    if (S.dbState === "nopack")
      return '<div class="empty"><h2>Application comptoir : aucune grille de prix chargée</h2><p>Ce fichier fonctionne sans connexion à claude.ai, mais il ne contient pas encore de grille de prix. Ouvrez le fichier « application comptoir » téléchargé depuis le Référentiel (il contient la grille), ou importez ici une grille de prix (.json) ou un fichier comptoir (.html).</p>' + packInput("pack-file", "Importer une grille de prix", true) + "</div>";
    if (S.dbState === "none")
      return emptyBlock("Référentiel indisponible", "Cette vue ne peut pas lire le référentiel partagé. Ouvrez l'application depuis claude.ai, connecté avec le compte auquel elle a été partagée.");
    if (!S.idx.profiles.length)
      return emptyBlock("Catalogue vide", adminMode() ? "Aucun profilé dans le catalogue. Ajoutez des séries dans Référentiel › Catalogue, ou importez une sauvegarde." : "Le catalogue des profilés n'a pas encore été publié par l'administrateur.", adminMode() ? '<a class="btn" href="#referentiel">Ouvrir le Référentiel</a>' : "");
    if (!S.pt)
      return emptyBlock("Aucun tarif disponible", adminMode() ? "Aucune version de tarif active. Créez ou activez une version dans Référentiel › Tarifs et marges." : "La grille de vente n'est pas encore publiée. L'administrateur doit activer et publier un tarif.", adminMode() ? '<a class="btn" href="#referentiel">Ouvrir le Référentiel</a>' : "");
    return null;
  }

  /* ================= TARIF (liste multicritère) ================= */
  function matches(p, except) {
    const tf = S.tf;
    if (except !== "fam" && tf.fam.length && !tf.fam.includes(p.famille)) return false;
    if (except !== "ser" && tf.ser.length && !tf.ser.includes(p.serieId)) return false;
    if (except !== "typ" && tf.typ.length && !tf.typ.includes(p.type)) return false;
    if (except !== "grp" && adminMode() && tf.grp.length) { const g = S.pt && S.pt.grp && S.pt.grp.get(p.key); if (!tf.grp.includes(g)) return false; }
    if (except !== "q" && tf.q) { const w = norm(tf.q).split(/\s+/).filter(Boolean); if (!w.every((x) => p.hay.includes(x))) return false; }
    return true;
  }
  function counts(facet, keyFn) {
    const m = new Map();
    for (const p of S.idx.profiles) if (matches(p, facet)) { const k = keyFn(p); m.set(k, (m.get(k) || 0) + 1); }
    return m;
  }
  const finIdx = () => (S.pt ? S.pt.finitions.findIndex((f) => f.id === S.tf.fin) : -1);
  const tierIdx = () => (S.pt ? S.pt.tiers.findIndex((t) => t.id === S.tier) : -1);
  function unitPrice(p, fi, ti, maj) {
    const pt = S.pt;
    const ht = E.salePrice(pt, p.key, fi, ti, maj);
    if (ht == null) return { ht: null, ttc: null, cout: null };
    const cout = E.costPrice(pt, p.key, fi, maj);
    if (S.tf.unite === "ml") {
      const L = pt.longueurBarre;
      const h = E.round2(ht / L);
      return { ht: h, ttc: E.ttc(pt, h), cout: cout == null ? null : E.round2(cout / L) };
    }
    return { ht, ttc: E.ttc(pt, ht), cout };
  }
  function marginOf(ht, cout) {
    if (!ok(ht) || !ok(cout) || cout <= 0) return null;
    return S.pt.methode === "vente" ? (ht - cout) / ht : (ht - cout) / cout;
  }
  function filteredSorted() {
    const list = S.idx.profiles.filter((p) => matches(p));
    const { k, d } = S.tf.sort;
    if (k !== "ordre") {
      const fi = finIdx(), ti = tierIdx(), maj = S.tf.tranche === "majore";
      const val = (p) => (k === "ref" ? p.ref : k === "des" ? norm(p.designation) : k === "poids" ? p.poids : k === "prix" ? E.salePrice(S.pt, p.key, fi, ti, maj) || 0 : p.ordre);
      list.sort((a, b) => { const x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : a.ordre - b.ordre) * d; });
    }
    return list;
  }

  function renderFilters() {
    const tf = S.tf;
    const nAct = tf.fam.length + tf.ser.length + tf.typ.length + tf.grp.length;
    $("#tf-ftoggle").textContent = "Filtres" + (nAct ? " (" + nAct + ")" : "");
    const famC = counts("fam", (p) => p.famille);

    const chk = (group, val, label, n, extra) =>
      '<label class="chk' + (n ? "" : " zero") + '"><input type="checkbox" data-f="' + group + '" value="' + esc(val) + '"' + (tf[group].includes(val) ? " checked" : "") + ">" + (extra || "") + "<span>" + esc(label) + '</span><span class="c">' + (n || 0) + "</span></label>";
    let h = '<div class="fhead"><h3>Famille</h3>' + (nAct || tf.q ? '<button type="button" class="linkbtn" data-act="reset-filters">Tout effacer</button>' : "") + "</div>";
    h += FAMILLES.map((f) => chk("fam", f, f, famC.get(f))).join("");
    h += "<h3>Série</h3><div class=\"serlist\">";
    for (const fam of FAMILLES) {
      const ss = S.idx.series.filter((s) => s.famille === fam);
      if (!ss.length) continue;
      h += '<div class="sergrp">' + esc(fam) + "</div>" + ss.map((s) => chk("ser", s.id, s.nom, serC.get(s.id))).join("");
    }
    const other = S.idx.series.filter((s) => !FAMILLES.includes(s.famille));
    if (other.length) h += other.map((s) => chk("ser", s.id, s.nom, serC.get(s.id))).join("");
    h += "</div><h3>Type de profilé</h3>";
    const types = TYPES.filter((t) => S.idx.profiles.some((p) => p.type === t)).concat(Array.from(new Set(S.idx.profiles.map((p) => p.type))).filter((t) => !TYPES.includes(t)));
    h += types.map((t) => chk("typ", t, t, typC.get(t))).join("");

      const av = activeVersion();

    }
    $("#tf-filters").innerHTML = h;
    const chips = [];

    $("#tf-chips").innerHTML = chips.join("");
  }

  /* ================= DEVIS ================= */
  function addLine(key, fid, qte) {
    const p = S.idx.byKey.get(key);
    if (!p) return;
    const fin = fid && fid !== S.quote.finitionDefaut ? fid : null;
    const ex = S.quote.lignes.find((l) => l.serie === p.serieId && l.ref === p.ref && (l.finition || null) === fin);
    let at;
    if (ex) { ex.qte = (+ex.qte || 0) + qte; at = S.quote.lignes.indexOf(ex); }
    else { S.quote.lignes.push({ serie: p.serieId, ref: p.ref, finition: fin, qte }); at = S.quote.lignes.length - 1; }
    S.quoteDirty = true;
    persistDraft();
    renderTop();
    toast(p.ref + " ajouté au devis (" + S.quote.lignes.length + " ligne" + (S.quote.lignes.length > 1 ? "s" : "") + ")");
    return at;
  }
  function calcQuote() {
    if (!S.pt) return null;
    S.quote.tier = S.tier;
    return E.computeQuote(S.pt, S.idx, S.quote);
  }
  function allSavedQuotes() {

    for (const el of els) { const p = profs[el.dataset.uid]; el.textContent = "par " + ((p && p.name) || (el.dataset.uid === S.meId ? "vous" : "un collègue")); }

  function quoteSearchResults(qs) {
    const w = norm(qs).split(/\s+/).filter(Boolean);
    if (!w.length) return [];
    const exact = [], rest = [];
    for (const p of S.idx.profiles) {
      if (!w.every((x) => p.hay.includes(x))) continue;
      (p.ref.toLowerCase().startsWith(w[0]) ? exact : rest).push(p);
      if (exact.length + rest.length > 60) break;
    }
    return exact.concat(rest).slice(0, 12);
  }

  async function saveQuote() {
    const q = S.quote;
    const r = calcQuote();
    if (!r) return;
    const now = nowIso();
    const doc = {
      numero: q.numero || genNumero(), date: q.date || localToday(), client: q.client || "", tel: q.tel || "", projet: q.projet || "", note: q.note || "",
      tier: S.tier, finitionDefaut: q.finitionDefaut, lignes: q.lignes.map((l) => ({ serie: l.serie, ref: l.ref, finition: l.finition || null, qte: +l.qte || 0 })),
      totaux: { ht: r.totals.ht, tva: r.totals.tva, ttc: r.totals.ttc, barres: r.totals.barres, poids: E.round2(r.totals.poids) },
      tarif: { versionId: S.pt.versionId, label: S.pt.label },
      creeLe: q.creeLe || now, creePar: q.creePar || S.meId || null, modifieLe: now, modifiePar: S.meId || null,
    };
    const useDb = S.db && S.canWriteDevis !== false && (q.src !== "local");
    if (useDb) {
      const id = q.src === "db" && q.id ? q.id : newId("d");
      try {
        await S.db.doc("devis/" + id).set(doc);
        Object.assign(q, doc, { id, src: "db" });
        S.quoteDirty = false;
        persistDraft();
        toast("Devis " + doc.numero + " enregistré");
        renderDevis();
        return;
      } catch (e) {
        if (e && e.code === "invalid_argument") S.canWriteDevis = false;
        else { toast("Enregistrement impossible : " + errMsg(e), "err"); return; }
      }
    }
    const id = q.src === "local" && q.id ? q.id : newId("l");
    const rec = Object.assign({}, doc, { id });
    S.localQuotes = S.localQuotes.filter((x) => x.id !== id).concat([rec]);
    LS.set("tps:local", S.localQuotes);
    Object.assign(q, doc, { id, src: "local" });
    S.quoteDirty = false;
    persistDraft();
    toast(S.dbState === "local" ? "Devis enregistré sur ce poste" : "Devis enregistré sur ce poste (pas de droit d'écriture partagé)");
    renderDevis();
  }
  function findSaved(k) {
    const [src, id] = [k.slice(0, k.indexOf(":")), k.slice(k.indexOf(":") + 1)];
    if (src === "db") { const d = S.devisDb.get(id); return d ? Object.assign(clone(d), { id, src }) : null; }
    const d = S.localQuotes.find((x) => x.id === id);
    return d ? Object.assign(clone(d), { src }) : null;
  }
  function openQuote(k) {
    const d = findSaved(k);
    if (!d) return;
    S.quote = Object.assign(newQuote(), d, { _v: Date.now() });
    if (d.tier) { S.tier = d.tier; LS.set("tps:tier", S.tier); }
    S.quoteDirty = false;
    S.quoteConfirm = null;
    S.copyText = null;
    recompute();
    persistDraft();
    renderAll();
  }
  async function deleteQuote(k) {
    const d = findSaved(k);
    if (!d) return;
    if (d.src === "db") {
      try { await S.db.doc("devis/" + d.id).delete(); } catch (e) { toast("Suppression impossible : " + errMsg(e), "err"); return; }
    } else {
      S.localQuotes = S.localQuotes.filter((x) => x.id !== d.id);
      LS.set("tps:local", S.localQuotes);
    }
    if (S.quote.id === d.id && S.quote.src === d.src) { S.quote.id = null; S.quote.src = null; S.quoteDirty = true; }
    S.quoteConfirm = null;
    toast("Devis supprimé");
    renderDevis();
  }
  function quoteText() {
    const q = S.quote, r = calcQuote(), pt = S.pt;
    const lines = ["Devis " + q.numero + " du " + fmtDate(q.date), "Client : " + (q.client || "—") + " (" + tierName(S.tier) + ")" + (q.tel ? " · " + q.tel : "") + (q.projet ? "\nProjet : " + q.projet : ""), ""];
    r.lines.forEach((o, i) => {
      if (!o.prof) return;
      lines.push((i + 1) + ". " + o.prof.ref + " " + o.prof.designation + " · " + finName(o.fid) + " · " + o.qte + " barre(s) × " + f2(o.puHT) + " DH HT = " + f2(o.montantHT) + " DH HT" + (o.majore ? " (moins de " + f0(pt.seuilKg) + " kg)" : ""));
    });
    lines.push("", "Total HT : " + f2(r.totals.ht) + " DH", "TVA " + pct(pt.tva) + " : " + f2(r.totals.tva) + " DH", "Total TTC : " + f2(r.totals.ttc) + " DH", "", "Prix par barre de " + f2(pt.longueurBarre) + " m. Tarif " + pt.label + ".");
    return lines.join("\n");

  const csvNum = (x) => (ok(x) ? String(E.round2(x)).replace(".", ",") : "");
  const csvTxt = (s) => '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"';
  const canExport = () => !!S.dl || !HAS_HOST;
  async function saveFile(filename, data) {
    if (S.dl) {
      try { await S.dl.save({ filename, data }); } catch (e) { if (e && e.code !== "declined") toast("Export impossible : " + errMsg(e), "err"); }
      return;
    }
    if (!HAS_HOST) {
      try {
        const type = /\.html$/.test(filename) ? "text/html" : /\.json$/.test(filename) ? "application/json" : "text/csv";
        const url = URL.createObjectURL(new Blob([data], { type: type + ";charset=utf-8" }));
        const a = document.createElement("a");
        a.href = url; a.download = filename; document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
      } catch (e) { toast("Export impossible : " + errMsg(e), "err"); }
      return;
    }
    toast("Export indisponible dans cette vue", "err");
  }

  const validPack = (p) => !!(p && p.format === "tarification-comptoir" && p.meta && p.vente && p.catalogue);
  function readEmbeddedPack() {

  }
  function applyPack(pk) {
    S.catDocs = new Map(Object.entries(pk.catalogue));
    S.vente = new Map(Object.entries(pk.vente));
    S.vente.set("_meta", pk.meta);
    S.loaded = { cat: true, vente: true, tarifs: true, config: true, devis: true };

  function packFromText(txt) {
    const t = String(txt || "").trim();
    let obj = null;
    if (t.startsWith("{")) obj = JSON.parse(t);
    else {
      const m = t.match(/<script id="tps-data" type="application\/json">([\s\S]*?)<\/script>/);
      if (m) obj = JSON.parse(m[1]);
    }
    return validPack(obj) ? obj : null;
  }
  function readPackFile(file) {
    const fr = new FileReader();
    fr.onload = () => {
      let pk = null;
      try { pk = packFromText(fr.result); } catch (e) { pk = null; }
      if (!pk) { toast("Ce fichier ne contient pas de grille de prix comptoir", "err"); return; }
      LS.set("tps:pack", pk);
      S.dbState = "local";
      applyPack(pk);
      route();
      renderAll();
      toast("Grille " + (pk.label || "") + " du " + fmtDT(pk.genereLe) + " chargée");
    };
    fr.readAsText(file);
  }
  function buildPack() {
    const meta = S.vente.get("_meta");
    if (!meta) return null;
    const vente = {};
    for (const [k, d] of S.vente) if (k !== "_meta") vente[k] = d;
    return { format: "tarification-comptoir", version: 1, genereLe: nowIso(), label: meta.label, meta, vente, catalogue: Object.fromEntries(S.catDocs) };
  }
  function buildStandaloneHtml(pk) {
    if (!SRC || !SRC.app || !SRC.engine || !SRC.css) return null;
    const close = "</" + "script>";
    const data = JSON.stringify(pk).replace(/</g, "\\u003c");
    return '<!doctype html>\n<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>' + esc(SRC.title) + "</title>" +
      '<link rel="stylesheet" href="' + FONT_HREF + '"><style>body{margin:0}[hidden]{display:none!important}\n' + SRC.css + "</style></head><body>\n" + SRC.shell +
      '\n<script id="tps-data" type="application/json">' + data + close + "\n<script>" + SRC.engine + close + "\n<script>" + SRC.app + close + "\n</body></html>";
  }
  const dayStamp = () => { const d = new Date(); return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); };
  function exportComptoir(kind) {
    const pk = buildPack();
    if (!pk) { toast("Aucune grille publiée à exporter", "err"); return; }
    if (kind === "json") { saveFile("Grille_comptoir_" + slugId(pk.label) + "_" + dayStamp() + ".json", JSON.stringify(pk)); return; }
    const html = buildStandaloneHtml(pk);
    if (!html) { toast("Export impossible : source de l'application introuvable", "err"); return; }
    saveFile("Comptoir_Strugal_" + slugId(pk.label) + "_" + dayStamp() + ".html", html);
  }
  function comptoirCard() {
    const meta = S.vente.get("_meta");
    const okGrid = !!meta && S.gridUpToDate !== false;
    let h = '<div class="card" style="grid-column:1/-1"><h3>Installation au comptoir (fichier autonome)</h3>' +
      '<p class="small muted" style="margin-top:0">L\'application comptoir est un seul fichier HTML qui contient le catalogue et la grille de vente publiée (3 tranches, toutes finitions), sans aucun prix d\'achat. Copiez-le sur les postes du comptoir et ouvrez-le dans le navigateur, sans compte claude.ai ; les devis sont enregistrés sur le poste. Quand les prix changent, téléchargez-le à nouveau et remplacez le fichier, ou chargez la grille seule (.json) avec « Mettre à jour la grille » sur chaque poste.</p>';
    if (!meta) h += '<div class="note">Aucune grille publiée : activez et publiez d\'abord un tarif.</div>';

    if (meta && meta.exemple) h += '<div class="note" style="margin-top:8px">La grille actuelle est calculée avec les marges d\'exemple (30 / 20 / 10 %). Saisissez vos taux réels avant d\'installer le fichier au comptoir.</div>';
    h += '<div class="actions" style="margin-top:10px">' + (canExport()
      ? '<button type="button" class="btn primary" data-act="export-comptoir-html"' + (okGrid ? "" : " disabled") + ">Télécharger l'application comptoir (HTML)</button>" +
        '<button type="button" class="btn" data-act="export-comptoir-json"' + (okGrid ? "" : " disabled") + ">Télécharger la grille seule (JSON)</button>"
      : '<span class="small muted">Téléchargement indisponible dans cette vue.</span>') + "</div></div>";
    return h;
  }
  function exportTarif() {
    const pt = S.pt, ti = tierIdx(), maj = S.tf.tranche === "majore";
    const head = ["Série", "Réf. Extrumaroc", "Réf. Strugal", "Désignation", "Type", "Poids kg/ml", "Surface m2/ml", "Poids barre kg"];
    pt.finitions.forEach((f) => head.push(f.nom + " HT/barre", f.nom + " TTC/barre"));
    const out = [head.map(csvTxt).join(";")];
    for (const p of filteredSorted()) {
      const row = [csvTxt(p.serie), csvTxt(p.ref), csvTxt(p.refStrugal), csvTxt(p.designation), csvTxt(p.type), csvNum(p.poids), csvNum(p.surface), csvNum(p.poids * pt.longueurBarre)];
      pt.finitions.forEach((f, fi) => { const h = E.salePrice(pt, p.key, fi, ti, maj); row.push(csvNum(h), csvNum(E.ttc(pt, h))); });
      out.push(row.join(";"));
    }
    const name = "Tarif_" + slugId(tierName(S.tier)) + "_" + slugId(pt.label) + (maj ? "_moins-" + pt.seuilKg + "kg" : "") + ".csv";
    saveFile(name, "﻿" + out.join("\r\n"));
  }
  function exportQuote() {
    const q = S.quote, r = calcQuote(), pt = S.pt;
    const out = [["Devis", q.numero].map(csvTxt).join(";"), ["Date", fmtDate(q.date)].map(csvTxt).join(";"), ["Client", q.client].map(csvTxt).join(";"), ["Type de client", tierName(S.tier)].map(csvTxt).join(";"), ["Projet", q.projet].map(csvTxt).join(";"), ""];
    out.push(["N°", "Réf.", "Désignation", "Série", "Finition", "Barres", "Poids kg", "Majoré", "PU HT", "PU TTC", "Montant HT"].map(csvTxt).join(";"));
    r.lines.forEach((o, i) => { if (o.prof) out.push([i + 1, csvTxt(o.prof.ref), csvTxt(o.prof.designation), csvTxt(o.prof.serie), csvTxt(finName(o.fid)), o.qte, csvNum(o.poidsLigne), o.majore ? "oui" : "non", csvNum(o.puHT), csvNum(o.puTTC), csvNum(o.montantHT)].join(";")); });
    out.push("", [csvTxt("Total HT"), csvNum(r.totals.ht)].join(";"), [csvTxt("TVA"), csvNum(r.totals.tva)].join(";"), [csvTxt("Total TTC"), csvNum(r.totals.ttc)].join(";"));
    saveFile("Devis_" + slugId(q.numero) + ".csv", "﻿" + out.join("\r\n"));
  }

  /* ================= RÉFÉRENTIEL (administrateur) ================= */
  function renderRef() {
    const root = $("#view-referentiel");
    if (!adminMode()) { root.innerHTML = ""; return; }
    if (S.dbState !== "ready" || !S.loaded.tarifs || !S.loaded.cat || !S.loaded.config) { root.innerHTML = dataGate() || emptyBlock("Chargement", "Lecture du référentiel…"); return; }
    const tabs = [["tarifs", "Tarifs et marges"], ["catalogue", "Catalogue des profilés"], ["publication", "Publication et sauvegarde"]];
    let h = '<div class="subtabs" role="group" aria-label="Sections du référentiel">' + tabs.map(([k, l]) => '<button type="button" data-act="ref-tab" data-v="' + k + '" aria-pressed="' + (S.ref.tab === k) + '">' + l + "</button>").join("") + "</div>";
    if (S.ref.tab === "tarifs") h += refTarifs();
    else if (S.ref.tab === "catalogue") h += refCatalogue();
    else h += refPublication();
    const focusId = document.activeElement && document.activeElement.id;
    const selStart = document.activeElement && document.activeElement.selectionStart;
    root.innerHTML = h;
    if (focusId) { const el = document.getElementById(focusId); if (el && el !== document.body) { el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch (e) { /* champ sans sélection */ } } }
    fillNames(root);
  }

  /* ---- versions ---- */
  function sortedVersions() {
    return Array.from(S.tarifs, ([id, v]) => ({ id, v })).sort((a, b) => String(b.v.dateEffet || "").localeCompare(String(a.v.dateEffet || "")) || String(b.v.creeLe || "").localeCompare(String(a.v.creeLe || "")));
  }
  function curVersion() {
    if (!S.ref.sel || !S.tarifs.has(S.ref.sel)) { const av = activeVersion(); S.ref.sel = av ? av.id : (sortedVersions()[0] || {}).id || null; }
    if (!S.ref.sel) return null;
    if (!S.ref.work) S.ref.work = clone(S.tarifs.get(S.ref.sel));
    return S.ref.work;
  }
  const statusPill = (st) => (st === "actif" ? '<span class="pill ok">Actif</span>' : st === "brouillon" ? '<span class="pill warn">Brouillon</span>' : '<span class="pill">Archivé</span>');
  function refTarifs() {
    const vs = sortedVersions();
    let h = '<div class="refgrid"><div class="vlist">';
    h += '<button type="button" class="btn primary" data-act="new-version-open">Nouvelle version de tarif</button>';
    if (S.ref.newOpen) {
      const src = activeVersion();
      h += '<div class="card"><h3>Nouvelle version</h3><div class="formgrid" style="grid-template-columns:1fr">' +
        '<label class="field" for="nv-label"><span>Nom (ex. 2027-Q1)</span><input id="nv-label" class="inp" type="text" value=""></label>' +
        '<label class="field" for="nv-date"><span>Date d\'effet</span><input id="nv-date" class="inp" type="date" value="' + localToday() + '"></label>' +
        '<label class="field" for="nv-src"><span>Copier les prix de</span><select id="nv-src" class="inp">' + vs.map((x) => '<option value="' + esc(x.id) + '"' + (src && src.id === x.id ? " selected" : "") + ">" + esc(x.v.label) + "</option>").join("") + "</select></label>" +

    }

    }

  }
  function vtext(path, val, cls) {

  }
  function vselect(path, val, opts, cls) {

        (S.ref.ro ? "" : '<button type="button" class="iconbtn" data-act="del-exc" data-k="' + esc(k) + '" aria-label="Supprimer l\'exception">×</button>') + "</td></tr>";
    }
    h += "</tbody></table></div>";
    if (!S.ref.ro) {
      const res = S.ref.excQ ? S.idx.profiles.filter((p) => norm(p.ref + " " + p.designation + " " + p.serie).includes(norm(S.ref.excQ))).slice(0, 8) : [];
      h += '<div class="addbox"><label class="field" for="exc-q" style="flex:1 1 260px"><span>Ajouter une exception : chercher un profilé</span><input id="exc-q" class="inp" type="search" value="' + esc(S.ref.excQ) + '" placeholder="Réf. ou désignation"></label></div>' +
        (res.length ? '<div class="chips">' + res.map((p) => '<button type="button" class="btn sm" data-act="add-exc" data-key="' + esc(p.key) + '"><span class="mono">' + esc(p.ref) + "</span> " + esc(p.designation) + " · " + esc(p.serie) + "</button>").join("") + "</div>" : "");
    }
    h += "</div>";

    if (S.ref.dirty) {
      const nbad = S.ref.bad.size;
      h += '<div class="savebar"><span>' + (nbad ? nbad + " valeur(s) invalide(s) à corriger" : "Modifications non enregistrées" + (st === "actif" ? " · la grille des agents sera republiée" : "")) + '</span><div class="actions"><button type="button" class="btn" data-act="cancel-version">Annuler</button><button type="button" class="btn primary" data-act="save-version"' + (nbad || S.ref.busy ? " disabled" : "") + ">" + (S.ref.busy ? "Enregistrement…" : "Enregistrer") + "</button></div></div>";
    }
    h += "</div>";
    return h;
  }

  function setPath(obj, path, val) {
    const ks = path.split(".");
    let o = obj;
    for (let i = 0; i < ks.length - 1; i++) {
      const k = ks[i];
      if (o[k] == null || typeof o[k] !== "object") o[k] = /^\d+$/.test(ks[i + 1]) ? [] : {};
      o = o[k];
    }
    const last = ks[ks.length - 1];
    if (val === undefined) delete o[last];
    else o[last] = val;
  }
  function onEditorInput(el) {
    const w = S.ref.work;
    if (!w) return;
    const path = el.dataset.path, kind = el.dataset.kind;
    let val;
    if (kind === "num" || kind === "pct") {
      const n = parseNum(el.value);
      const blankOk = path.startsWith("marges.parGroupe.");
      if (el.value.trim() === "" && blankOk) { val = undefined; S.ref.bad.delete(path); }
      else if (!isFinite(n) || n < 0 || (kind === "pct" && n >= 1000)) { S.ref.bad.add(path); el.classList.add("bad"); S.ref.dirty = true; updateSaveBar(); return; }
      else { val = kind === "pct" ? E.round2(n * 1000) / 100000 : n; S.ref.bad.delete(path); }
      el.classList.remove("bad");
      if (path.startsWith("marges.tiers.") || path.startsWith("marges.parGroupe.")) { if (w.marges) w.marges.exemple = false; }
    } else if (kind === "bool") val = !!el.checked;
    else if (kind === "sel") val = path === "marges.arrondi" ? parseNum(el.value) : el.value;
    else val = el.value;
    if (path.startsWith("exceptions.")) { w.exceptions = w.exceptions || {}; w.exceptions[path.slice(11)] = val; }
    else if (path.startsWith("series.")) { w.series = w.series || {}; if (val) w.series[path.slice(7)] = val; }
    else if (path.startsWith("marges.parGroupe.")) {
      const rest = path.slice(17); const cut = rest.lastIndexOf(".");
      const gid = rest.slice(0, cut), tid = rest.slice(cut + 1);
      w.marges.parGroupe = w.marges.parGroupe || {};
      const o = (w.marges.parGroupe[gid] = w.marges.parGroupe[gid] || {});
      if (val === undefined) delete o[tid]; else o[tid] = val;
      if (!Object.keys(o).length) delete w.marges.parGroupe[gid];
    } else setPath(w, path, val);
    S.ref.dirty = true;
    updateSaveBar();
  }
  function updateSaveBar() {
    if (!$(".savebar")) { renderRef(); return; }
    const nbad = S.ref.bad.size;
    const span = $(".savebar > span");
    if (span) span.textContent = nbad ? nbad + " valeur(s) invalide(s) à corriger" : "Modifications non enregistrées";
    const b = $('.savebar [data-act="save-version"], .savebar [data-act="save-cat"]');
    if (b) b.disabled = nbad > 0 || S.ref.busy;
  }
  async function saveVersion() {
    const id = S.ref.sel, w = S.ref.work;
    if (!id || !w || S.ref.bad.size) return;
    const errs = [];
    if (!String(w.label || "").trim()) errs.push("nom de version");
    if (!(w.groupes || []).length) errs.push("au moins un groupe");
    if (!(w.finitions || []).length) errs.push("au moins une finition");
    if (!(w.conditions && w.conditions.longueurBarre > 0)) errs.push("longueur de barre");
    if (errs.length) { toast("À compléter : " + errs.join(", "), "err"); return; }
    const data = clone(w);
    data.modifieLe = nowIso();
    data.modifiePar = S.meId || null;
    S.ref.busy = true; updateSaveBar();
    try {
      await S.db.doc("tarifs/" + id).set(data);
      S.ref.dirty = false; S.ref.work = null; S.ref.remoteChanged = false;
      toast("Tarif « " + data.label + " » enregistré");
      const av = activeVersion();
      if (av && av.id === id) await publishGrid({ id, v: data });
    } catch (e) { toast("Enregistrement impossible : " + errMsg(e), "err"); }
    finally { S.ref.busy = false; renderRef(); }
  }
  async function createVersion() {
    const label = ($("#nv-label").value || "").trim();
    const date = $("#nv-date").value || localToday();
    const srcId = $("#nv-src") ? $("#nv-src").value : null;
    if (!label) { toast("Donnez un nom à la version (ex. 2027-Q1)", "err"); return; }
    const src = srcId && S.tarifs.get(srcId);
    if (!src) { toast("Choisissez une version source", "err"); return; }
    const data = clone(src);
    Object.assign(data, { label, dateEffet: date, statut: "brouillon", note: "Copie de " + (src.label || srcId), creeLe: nowIso(), creePar: S.meId || null, modifieLe: nowIso(), modifiePar: S.meId || null });
    const id = slugId(label) + "-" + rid();
    try {
      await S.db.doc("tarifs/" + id).set(data);
      S.ref.newOpen = false; S.ref.sel = id; S.ref.work = null; S.ref.dirty = false; S.ref.bad.clear();
      toast("Brouillon « " + label + " » créé : modifiez les prix puis activez-le");

  }
  async function activateVersion() {
    const id = S.ref.sel, v = S.tarifs.get(id);

  async function deleteVersion() {
    const id = S.ref.sel;

    try { await S.db.doc("tarifs/" + id).delete(); S.ref.sel = null; S.ref.work = null; toast("Brouillon supprimé"); } catch (e) { toast("Suppression impossible : " + errMsg(e), "err"); }

  /* ---- publication de la grille de vente ---- */
  async function publishGrid(avIn) {
    const av = avIn || activeVersion();
    if (!av || !S.db) return;
    if (S.publishing) { S.publishAgain = true; return; }
    S.publishing = true;
    renderStatus();
    try {
      const pt = E.buildPriceTable(av.v, S.idx, av.id);
      const stamp = E.stampOf(av.id, av.v, catDocList());
      const g = E.gridFromPT(pt, S.idx, stamp);
      const todo = Object.keys(g.docs).filter((sid) => { const old = S.vente.get(sid); return !old || E.canon(old) !== E.canon(g.docs[sid]); });
      let i = 0;
      const worker = async () => { while (i < todo.length) { const sid = todo[i++]; await S.db.doc("vente/" + sid).set(g.docs[sid]); } };
      await Promise.all([worker(), worker(), worker(), worker()]);
      for (const k of Array.from(S.vente.keys())) if (k !== "_meta" && !g.docs[k]) await S.db.doc("vente/" + k).delete();
      await S.db.doc("vente/_meta").set(Object.assign({}, g.meta, { publieLe: nowIso(), publiePar: S.meId || null }));
      toast("Grille de vente des agents publiée (" + pt.label + ", " + todo.length + " série(s) mise(s) à jour)");
    } catch (e) {
      toast("Publication impossible : " + errMsg(e), "err");
    } finally {
      S.publishing = false;
      renderStatus();
      if (S.publishAgain) { S.publishAgain = false; publishGrid(); }
    }
  }

  function exportJson() {

  function readImport(file) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const d = JSON.parse(String(fr.result));
        if (!d || d.format !== "tarification-profiles-strugal" || typeof d.tarifs !== "object" || typeof d.catalogue !== "object") throw new Error("format");
        S.ref.importData = d;
      } catch (e) { toast("Ce fichier n'est pas une sauvegarde du référentiel", "err"); S.ref.importData = null; }
      renderRef();
    };
    fr.readAsText(file);
  }
  async function doImport() {
    const d = S.ref.importData;

      for (const [id, v] of Object.entries(d.catalogue)) await S.db.doc("catalogue/" + id).set(v);
      for (const [id, v] of Object.entries(d.tarifs)) await S.db.doc("tarifs/" + id).set(v);
      if (d.config && d.config.tarifActif) await S.db.doc("config/app").set(d.config);

      if (d.config && d.tarifs[d.config.tarifActif]) {
        S.catDocs = new Map(Object.entries(d.catalogue));
        rebuildIndex();
        await publishGrid({ id: d.config.tarifActif, v: d.tarifs[d.config.tarifActif] });
      }
    } catch (e) { toast("Restauration interrompue : " + errMsg(e), "err"); }
    renderAll();
  }

  function bindGlobal() {
    window.addEventListener("hashchange", () => { route(); renderAll(); window.scrollTo(0, 0); });
    document.addEventListener("keydown", (e) => {
      const rb = e.target && e.target.getAttribute && e.target.getAttribute("role") === "button" && e.target.dataset && e.target.dataset.act;
      if (rb && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.target.click(); return; }
      if (e.key === "Escape" && S.drawer) { S.drawer = null; renderDrawer(); }
      if (e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && S.view === "tarif") { const q = $("#tf-q"); if (q) { e.preventDefault(); q.focus(); } }
    });
