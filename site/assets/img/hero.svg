<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3340"/>
      <stop offset="1" stop-color="#11151c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4453"/>
      <stop offset="0.5" stop-color="#566273"/>
      <stop offset="1" stop-color="#2c3440"/>
    </linearGradient>
    <linearGradient id="glass2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46525f"/>
      <stop offset="1" stop-color="#222a34"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa3ad"/>
      <stop offset="0.5" stop-color="#cfd6dd"/>
      <stop offset="1" stop-color="#8b949e"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- building facade right -->
  <g opacity="0.95">
    <rect x="900" y="60" width="700" height="840" fill="url(#glass2)"/>
    <g fill="url(#glass)">
      <rect x="930" y="90" width="200" height="240"/>
      <rect x="1150" y="90" width="200" height="240"/>
      <rect x="1370" y="90" width="200" height="240"/>
      <rect x="930" y="350" width="200" height="240"/>
      <rect x="1150" y="350" width="200" height="240"/>
      <rect x="1370" y="350" width="200" height="240"/>
      <rect x="930" y="610" width="200" height="240"/>
      <rect x="1150" y="610" width="200" height="240"/>
      <rect x="1370" y="610" width="200" height="240"/>
    </g>
    <!-- aluminium mullions -->
    <g fill="url(#alu)">
      <rect x="900" y="60" width="14" height="840"/>
      <rect x="1120" y="60" width="14" height="840"/>
      <rect x="1340" y="60" width="14" height="840"/>
      <rect x="1560" y="60" width="14" height="840"/>
      <rect x="900" y="76" width="700" height="14"/>
      <rect x="900" y="336" width="700" height="14"/>
      <rect x="900" y="596" width="700" height="14"/>
      <rect x="900" y="856" width="700" height="14"/>
    </g>
    <!-- glass highlights -->
    <g opacity="0.18" fill="#ffffff">
      <polygon points="930,90 1010,90 950,330 930,330"/>
      <polygon points="1150,350 1230,350 1170,590 1150,590"/>
      <polygon points="1370,610 1450,610 1390,850 1370,850"/>
    </g>
  </g>

  <!-- red accent diagonal -->
  <polygon points="0,900 360,900 120,520" fill="#c8202f" opacity="0.12"/>
  <rect x="60" y="0" width="6" height="900" fill="#c8202f" opacity="0.25"/>
</svg>
